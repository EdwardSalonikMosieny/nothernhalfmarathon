<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Website Suspended</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Arial, Helvetica, sans-serif;
        background: #f4f4f2;
        color: #181818;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      main {
        width: min(720px, 100%);
        border: 1px solid #d6d6d2;
        background: #ffffff;
        padding: clamp(28px, 6vw, 56px);
        text-align: center;
      }

      h1 {
        margin: 0 0 18px;
        font-size: clamp(32px, 6vw, 58px);
        line-height: 1;
        letter-spacing: 0;
        text-transform: uppercase;
      }

      p {
        margin: 0;
        font-size: clamp(18px, 3vw, 24px);
        line-height: 1.45;
      }

      strong {
        color: #a42121;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Website Suspended</h1>
      <p>
        Access to this website has been politely suspended until the outstanding
        balance of <strong>KES 13,700</strong> is paid to E-Tech Creatives.
        Normal access will be restored once this obligation is honored.
      </p>
    </main>
  </body>
</html>
